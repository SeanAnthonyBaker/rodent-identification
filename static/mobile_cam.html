<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RodentWatch AI — S21 Ultra Live Cam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: manipulation; }
    #videoPreview { object-fit: cover; }
  </style>
</head>
<body class="h-full flex flex-col justify-between p-4 bg-slate-950 select-none">

  <!-- Header -->
  <header class="flex items-center justify-between bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl backdrop-blur">
    <div class="flex items-center gap-2.5">
      <span class="text-xl" id="headerDeviceIcon">📱</span>
      <div>
        <h1 class="text-sm font-bold text-white leading-none" id="headerDeviceTitle">Samsung S21 Ultra Cam</h1>
        <p class="text-[11px] text-slate-400 mt-0.5" id="headerSubtitle">Streaming to Vision AI</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Device Selector (S21 vs Tab A11+) -->
      <select id="mobileDeviceSelect" class="bg-slate-950 text-amber-300 text-xs font-bold border border-slate-700 rounded-lg px-2.5 py-1 focus:border-amber-500 focus:outline-none">
        <option value="Samsung Galaxy S21 Ultra">📱 S21 Ultra</option>
        <option value="Galaxy Tab A11+">📟 Tab A11+</option>
      </select>

      <!-- Mobile Target Selector -->
      <select id="mobileTargetSelect" class="bg-slate-950 text-emerald-300 text-xs font-bold border border-slate-700 rounded-lg px-2.5 py-1 focus:border-emerald-500 focus:outline-none">
        <option value="all">🌐 All</option>
        <option value="rat">🐀 Rat</option>
        <option value="bird">🐦 Bird</option>
        <option value="tree">🌲 Tree</option>
        <option value="horse">🐴 Horse</option>
        <option value="horses_poo">🐴💩 Horses poo</option>
      </select>

      <span id="streamStatusBadge" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-mono flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-slate-500"></span> Standby
      </span>
    </div>
  </header>

  <!-- Video Preview Canvas -->
  <main class="relative flex-1 my-3 bg-black rounded-2xl border border-slate-800 overflow-hidden flex items-center justify-center">
    <!-- Front / Back Quick Flip Overlay -->
    <button id="btnOverlayFlipCamera" type="button" class="absolute top-4 left-4 bg-slate-900/85 hover:bg-slate-800 border border-slate-700 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg active:scale-95 transition z-20" title="Switch Front / Back Camera View">
      <span>🔄</span> <span id="overlayFlipCameraLabel">Back (Rear) Cam</span>
    </button>

    <video id="videoPreview" autoplay playsinline muted class="w-full h-full object-cover scale-y-[1.40] origin-center"></video>
    
    <!-- Motion Alert Overlay -->
    <div id="motionAlert" class="hidden absolute top-4 right-4 bg-red-600/90 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow-lg animate-pulse flex items-center gap-1.5 z-20">
      <span id="motionAlertIcon">🚨</span> <span id="motionAlertText">Scanning Movement...</span>
    </div>

    <!-- Error Banner Overlay -->
    <div id="errorBanner" class="hidden absolute inset-4 bg-red-950/90 border border-red-800 rounded-xl p-4 text-xs text-red-200 flex flex-col items-center justify-center text-center gap-2 z-30">
      <span class="text-2xl">⚠️</span>
      <span id="errorMessage" class="font-semibold">Camera Error</span>
      <p class="text-[11px] text-red-300">Please make sure camera permissions are allowed in your browser settings.</p>
    </div>

    <!-- Live Telemetry Overlays -->
    <div class="absolute bottom-4 left-4 bg-black/75 backdrop-blur border border-slate-800 px-3 py-1 rounded-lg text-xs font-mono text-slate-300 flex items-center gap-2 z-20">
      <span id="resolutionLabel">1080p 30fps</span>
      <span>•</span>
      <span id="fpsLabel" class="text-amber-400">Sent: 0</span>
    </div>
  </main>

  <!-- Bottom Controls -->
  <footer class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl backdrop-blur flex flex-col gap-3">
    <!-- Lens / Flip Controls -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5">
        <span class="text-xs text-slate-400 font-semibold">Lens:</span>
        <button class="btn-lens px-2.5 py-1 bg-amber-600 text-white text-xs font-bold rounded-lg transition" data-zoom="1.0">1x</button>
        <button class="btn-lens px-2.5 py-1 bg-slate-800 hover:bg-slate-700 active:bg-amber-600 text-xs font-bold rounded-lg transition" data-zoom="3.0">3x</button>
        <button class="btn-lens px-2.5 py-1 bg-slate-800 hover:bg-slate-700 active:bg-amber-600 text-xs font-bold rounded-lg transition" data-zoom="10.0">10x</button>
      </div>
      <!-- Flip Front / Back Button -->
      <button id="btnFlipCamera" type="button" class="px-3 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-bold transition flex items-center gap-1 active:scale-95 shadow" title="Switch between Rear (Back) and Front (Selfie) camera">
        <span>🔄</span> <span id="flipCameraLabel">Rear Cam</span>
      </button>
    </div>

    <!-- Main Start/Stop Stream Button -->
    <button id="btnToggleBroadcast" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-98 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
      <span>📹</span> <span id="btnToggleText">Start Streaming Rear Camera</span>
    </button>

    <!-- Picture Mode Controls -->
    <div class="grid grid-cols-2 gap-2">
      <button id="btnSnapPicture" type="button" class="py-2.5 bg-sky-600 hover:bg-sky-500 active:scale-98 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5 shadow">
        <span>📸</span> <span id="btnSnapText">Snap &amp; Set Picture</span>
      </button>
      <label class="py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-98 text-slate-200 border border-slate-700 font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5 shadow cursor-pointer text-center">
        <span>📁</span> <span>Upload Picture</span>
        <input type="file" id="inputUploadPicture" accept="image/*" class="hidden" />
      </label>
    </div>
  </footer>


  <script>
    const videoPreview = document.getElementById("videoPreview");
    const btnToggleBroadcast = document.getElementById("btnToggleBroadcast");
    const btnToggleText = document.getElementById("btnToggleText");
    const streamStatusBadge = document.getElementById("streamStatusBadge");
    const motionAlert = document.getElementById("motionAlert");
    const errorBanner = document.getElementById("errorBanner");
    const errorMessage = document.getElementById("errorMessage");
    const resolutionLabel = document.getElementById("resolutionLabel");
    const fpsLabel = document.getElementById("fpsLabel");
    const lensButtons = document.querySelectorAll(".btn-lens");
    const btnFlipCamera = document.getElementById("btnFlipCamera");
    const flipCameraLabel = document.getElementById("flipCameraLabel");
    const btnOverlayFlipCamera = document.getElementById("btnOverlayFlipCamera");
    const overlayFlipCameraLabel = document.getElementById("overlayFlipCameraLabel");

    const headerDeviceIcon = document.getElementById("headerDeviceIcon");
    const headerDeviceTitle = document.getElementById("headerDeviceTitle");
    const mobileDeviceSelect = document.getElementById("mobileDeviceSelect");

    function updateDeviceHeaderUI(devName) {
      const isTab = (devName || "").toLowerCase().includes("tab") || (devName || "").toLowerCase().includes("a11");
      if (headerDeviceTitle) {
        headerDeviceTitle.textContent = isTab ? "Galaxy Tab A11+ Cam" : "Samsung S21 Ultra Cam";
      }
      if (headerDeviceIcon) {
        headerDeviceIcon.textContent = isTab ? "📟" : "📱";
      }
      document.title = isTab ? "RodentWatch AI — Galaxy Tab A11+ Live Cam" : "RodentWatch AI — S21 Ultra Live Cam";
    }

    const urlParams = new URLSearchParams(window.location.search);
    const camParam = (urlParams.get("cam") || urlParams.get("device") || "").toLowerCase();
    const savedDevice = localStorage.getItem("mobile_cam_device");

    // Auto-detect tablet vs phone from User Agent & Screen dimensions
    const ua = (navigator.userAgent || "").toLowerCase();
    const isTabletUA = /sm-[tx]|tablet|nexus 7|nexus 9|nexus 10|sm-x/i.test(ua) ||
                       (ua.includes("android") && !ua.includes("mobile")) ||
                       (Math.min(window.screen.width, window.screen.height) >= 600 && ua.includes("android"));

    if (mobileDeviceSelect) {
      if (camParam.includes("tab") || camParam.includes("a11")) {
        mobileDeviceSelect.value = "Galaxy Tab A11+";
        localStorage.setItem("mobile_cam_device", "Galaxy Tab A11+");
      } else if (camParam.includes("s21") || camParam.includes("phone")) {
        mobileDeviceSelect.value = "Samsung Galaxy S21 Ultra";
        localStorage.setItem("mobile_cam_device", "Samsung Galaxy S21 Ultra");
      } else if (savedDevice) {
        mobileDeviceSelect.value = savedDevice;
      } else if (isTabletUA) {
        mobileDeviceSelect.value = "Galaxy Tab A11+";
        localStorage.setItem("mobile_cam_device", "Galaxy Tab A11+");
      } else {
        mobileDeviceSelect.value = "Samsung Galaxy S21 Ultra";
      }

      updateDeviceHeaderUI(mobileDeviceSelect.value);

      mobileDeviceSelect.addEventListener("change", () => {
        localStorage.setItem("mobile_cam_device", mobileDeviceSelect.value);
        updateDeviceHeaderUI(mobileDeviceSelect.value);
      });
    }

    let currentStream = null;
    let isBroadcasting = false;
    let broadcastInterval = null;
    let currentZoom = 1.0;
    let track = null;
    let sentFrameCount = 0;
    let phoneBatteryPct = null;
    let isPhoneCharging = false;
    let currentFacingMode = "environment"; // "environment" = Rear/Back, "user" = Front/Selfie

    if (typeof navigator.getBattery === "function") {
      navigator.getBattery().then(bat => {
        phoneBatteryPct = Math.round(bat.level * 100);
        isPhoneCharging = bat.charging;
        bat.addEventListener('levelchange', () => {
          phoneBatteryPct = Math.round(bat.level * 100);
        });
        bat.addEventListener('chargingchange', () => {
          isPhoneCharging = bat.charging;
        });
      }).catch(() => {});
    }

    async function flipCamera() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      const isRear = (currentFacingMode === "environment");
      const name = isRear ? "Rear Cam" : "Front Cam";
      if (flipCameraLabel) flipCameraLabel.textContent = name;
      if (overlayFlipCameraLabel) overlayFlipCameraLabel.textContent = name;

      if (!isBroadcasting) {
        btnToggleText.textContent = `Start Streaming ${isRear ? "Rear" : "Front"} Camera`;
        return;
      }

      // Hot-swap stream seamlessly while broadcasting
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        currentStream = await getCameraStream();
        videoPreview.srcObject = currentStream;
        await videoPreview.play();

        track = currentStream.getVideoTracks()[0];
        const settings = track.getSettings ? track.getSettings() : {};
        if (settings.width && settings.height) {
          resolutionLabel.textContent = `${settings.width}x${settings.height} @ ${settings.frameRate || 30}fps`;
        }
      } catch (err) {
        console.error("Camera flip error:", err);
      }
    }

    if (btnFlipCamera) btnFlipCamera.addEventListener("click", flipCamera);
    if (btnOverlayFlipCamera) btnOverlayFlipCamera.addEventListener("click", flipCamera);

    btnToggleBroadcast.addEventListener("click", toggleBroadcast);

    async function toggleBroadcast() {
      if (isBroadcasting) {
        stopBroadcast();
      } else {
        await startBroadcast();
      }
    }

    async function getCameraStream() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("getUserMedia is not supported on this browser or context. Please ensure you are visiting via HTTPS (https://...).");
      }

      const facingConstraint = { ideal: currentFacingMode };

      // Try full HD with preferred facing mode
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingConstraint,
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30 }
          },
          audio: false
        });
      } catch (e1) {
        console.warn("Tier 1 camera constraints failed, trying basic facing...", e1);
      }

      // Try basic facing mode
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingConstraint },
          audio: false
        });
      } catch (e2) {
        console.warn("Tier 2 camera constraints failed, trying generic video...", e2);
      }

      // Fallback to any available video stream
      return await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });
    }

    async function startBroadcast() {
      errorBanner.classList.add("hidden");
      btnToggleText.textContent = "Connecting...";
      btnToggleBroadcast.disabled = true;

      try {
        currentStream = await getCameraStream();
        videoPreview.srcObject = currentStream;
        await videoPreview.play();

        track = currentStream.getVideoTracks()[0];
        const settings = track.getSettings ? track.getSettings() : {};
        if (settings.width && settings.height) {
          resolutionLabel.textContent = `${settings.width}x${settings.height} @ ${settings.frameRate || 30}fps`;
        } else {
          resolutionLabel.textContent = "Camera Live";
        }

        isBroadcasting = true;
        sentFrameCount = 0;
        streamStatusBadge.className = "text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-full font-mono flex items-center gap-1.5";
        streamStatusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Broadcast';

        btnToggleBroadcast.disabled = false;
        btnToggleBroadcast.className = "w-full py-3.5 bg-red-600 hover:bg-red-500 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-red-600/20";
        btnToggleText.textContent = "Stop Stream";

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

    const mobileTargetSelect = document.getElementById("mobileTargetSelect");
    const motionAlertIcon = document.getElementById("motionAlertIcon");
    const motionAlertText = document.getElementById("motionAlertText");

    // Fetch initial target
    fetch("/api/settings").then(r => r.json()).then(data => {
      if (data && data.target_object && mobileTargetSelect) {
        mobileTargetSelect.value = data.target_object;
      }
    }).catch(() => {});

    if (mobileTargetSelect) {
      mobileTargetSelect.addEventListener("change", async () => {
        try {
          await fetch("/api/target_object", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_object: mobileTargetSelect.value })
          });
        } catch (e) {
          console.warn("Could not sync target:", e);
        }
      });
    }

    let isUploading = false;
    broadcastInterval = setInterval(async () => {
      if (!isBroadcasting || videoPreview.videoWidth === 0 || isUploading) return;
      isUploading = true;

      // Preserve native video sensor aspect ratio (prevent squashing portrait/4:3 into 16:9)
      const vWidth = videoPreview.videoWidth;
      const vHeight = videoPreview.videoHeight;
      if (canvas.width !== vWidth || canvas.height !== vHeight) {
        canvas.width = vWidth;
        canvas.height = vHeight;
      }

      ctx.drawImage(videoPreview, 0, 0, vWidth, vHeight);
      const b64 = canvas.toDataURL("image/jpeg", 0.75);

      let controller = new AbortController();
      let timeoutId = setTimeout(() => controller.abort(), 2000);

      try {
        const resp = await fetch("/api/screen_cam/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            image_base64: b64,
            device_name: `${mobileDeviceSelect ? mobileDeviceSelect.value : "Samsung Galaxy S21 Ultra"} (${currentZoom}x)`,
            battery_percentage: phoneBatteryPct,
            is_charging: isPhoneCharging
          })
        });
        clearTimeout(timeoutId);
        if (resp.ok) {
          sentFrameCount++;
          fpsLabel.textContent = `Live: ${sentFrameCount} frames`;
          const res = await resp.json();
          if (res.detected || res.rat_detected) {
            const emojis = { tree: "🌲", bird: "🐦", pheasant: "🦚", rodent: "🐀", rat: "🐀", horse: "🐴", horses_poo: "🐴💩" };
            const label = res.label || "Target";
            const emoji = emojis[res.object_type] || "🎯";
            motionAlertIcon.textContent = emoji;
            motionAlertText.textContent = `${label} Identified!`;
            motionAlert.classList.remove("hidden");
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            setTimeout(() => motionAlert.classList.add("hidden"), 3000);
          }
        }
      } catch (e) {
        clearTimeout(timeoutId);
        console.debug("Frame upload error:", e);
      } finally {
        isUploading = false;
      }
    }, 120);

      } catch (err) {
        console.error("Camera startup error:", err);
        errorBanner.classList.remove("hidden");
        errorMessage.textContent = err.message || "Could not open camera stream";
        btnToggleBroadcast.disabled = false;
        btnToggleText.textContent = "Start Streaming Rear Camera";
      }
    }

    function stopBroadcast() {
      isBroadcasting = false;
      if (broadcastInterval) clearInterval(broadcastInterval);
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      videoPreview.srcObject = null;

      streamStatusBadge.className = "text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-mono flex items-center gap-1.5";
      streamStatusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-500"></span> Standby';

      btnToggleBroadcast.className = "w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20";
      btnToggleText.textContent = "Start Streaming Rear Camera";
      fpsLabel.textContent = "Sent: 0";
    }

    lensButtons.forEach(btn => {
      btn.addEventListener("click", async () => {
        const zoomVal = parseFloat(btn.getAttribute("data-zoom"));
        currentZoom = zoomVal;
        lensButtons.forEach(b => b.className = "btn-lens px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-lg transition");
        btn.className = "btn-lens px-3 py-1 bg-amber-600 text-white text-xs font-bold rounded-lg transition";

        if (track && track.getCapabilities) {
          const caps = track.getCapabilities();
          if (caps.zoom) {
            try {
              await track.applyConstraints({ advanced: [{ zoom: Math.min(caps.zoom.max, zoomVal) }] });
            } catch (e) {
              console.warn("Hardware zoom error:", e);
            }
          }
        }
      });
    });

    const btnSnapPicture = document.getElementById("btnSnapPicture");
    const btnSnapText = document.getElementById("btnSnapText");
    const inputUploadPicture = document.getElementById("inputUploadPicture");

    async function uploadPictureBlob(blob) {
      btnSnapText.textContent = "Uploading...";
      btnSnapPicture.disabled = true;
      try {
        const fd = new FormData();
        fd.append("file", blob, "s21_snap.jpg");
        const res = await fetch("/api/camera/Samsung Galaxy S21 Ultra/upload_picture", {
          method: "POST",
          body: fd
        });
        if (res.ok) {
          btnSnapText.textContent = "✅ Picture Set!";
          setTimeout(() => { btnSnapText.textContent = "Snap & Set Picture"; btnSnapPicture.disabled = false; }, 2000);
        } else {
          alert("Failed to upload: " + res.statusText);
          btnSnapText.textContent = "Snap & Set Picture";
          btnSnapPicture.disabled = false;
        }
      } catch (e) {
        alert("Upload error: " + e.message);
        btnSnapText.textContent = "Snap & Set Picture";
        btnSnapPicture.disabled = false;
      }
    }

    if (btnSnapPicture) {
      btnSnapPicture.addEventListener("click", async () => {
        if (videoPreview && videoPreview.videoWidth > 0) {
          const snapCanvas = document.createElement("canvas");
          snapCanvas.width = videoPreview.videoWidth;
          snapCanvas.height = videoPreview.videoHeight;
          const sCtx = snapCanvas.getContext("2d");
          sCtx.drawImage(videoPreview, 0, 0, snapCanvas.width, snapCanvas.height);
          snapCanvas.toBlob(blob => {
            if (blob) uploadPictureBlob(blob);
          }, "image/jpeg", 0.92);
        } else {
          // If video not active, open file chooser directly
          inputUploadPicture.click();
        }
      });
    }

    if (inputUploadPicture) {
      inputUploadPicture.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          uploadPictureBlob(file);
        }
      });
    }
  </script>
</body>
</html>
