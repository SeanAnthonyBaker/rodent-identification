node:
  role: detection
  detection_node: roland1
  inference_node: roland3
  supabase_node: roland1
inference:
  camera_polygons:
    Garden: null
    S21: null
  confidence_threshold: 0.8
  detection_polygon: null
  endpoint_type: ollama
  endpoint_url: http://roland3:11434
  gemini_api_key: YOUR_GEMINI_API_KEY_HERE
  gemini_model: gemini-2.5-flash
  model_name: gemma-4-e12b
  target_object: rat
  timeout_seconds: 45.0
ring:
  active_detection_interval_seconds: 2
  device_name: S21
  mock_if_unavailable: true
  phone_camera_url: http://192.168.1.165:8080/video
  sample_interval_seconds: 10
  token_file: ring_token.json
server:
  host: 0.0.0.0
  port: 8000
storage:
  backend: auto
  supabase_url: http://roland1:54321
  supabase_key: YOUR_SUPABASE_KEY_OR_SECRET
  supabase_table: detections
  supabase_bucket: detections
  fallback_to_sqlite: true
  db_path: data/detections.db
  detections_dir: data/detections
  max_images_to_keep: 1000

